[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-quant"
version = "0.6.0"
description = "A 股 AI 量化投资工作系统 —— 把风险控制排在选股前面"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# 真实数据源。不进主依赖，因为 Lite 之外的用法才需要
data = ["akshare>=1.12.0"]
# AI 研究助手
ai = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0"]
all = ["akshare>=1.12.0", "anthropic>=0.40.0", "pytest>=7.0"]

[project.scripts]
# 人用的入口
artemis = "artemis.lite:main"
# agent 用的入口：JSON 输出 + 明确退出码
artemis-svc = "artemis.service:main"

[tool.setuptools.packages.find]
include = ["artemis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
